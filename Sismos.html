<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MichiHub | Sismos</title>
<style>
img{
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
}
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Playfair+Display:ital@1&display=swap');

:root {
    --bg-base: #f4f0ea;
    --text-main: #4a4238;
    --card-bg: rgba(255, 255, 255, 0.6);
    --accent: #b09e8d;
    --shadow: rgba(138, 125, 110, 0.15);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    background-color:var(--bg-base);
    background-image:url('https://www.transparenttextures.com/patterns/cream-paper.png');
    color:var(--text-main);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    padding:30px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* HEADER */
header{
    width:100%;
    max-width:600px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:20px;
    gap:20px;
}

.logo-area h1{
    font-family:'Playfair Display',serif;
    font-size:2.5rem;
}

.link-recuperar{display:block;text-align:center;margin-top:12px;font-size:0.85rem;color:var(--text-main);opacity:0.7;text-decoration:underline;cursor:pointer}

/* MENU DE NAVEGACION */
nav.menu-principal{
    width:100%;
    max-width:600px;
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:20px;
    flex-wrap:nowrap;
}
nav.menu-principal a{
    text-decoration:none;
    color:var(--text-main);
    background:var(--card-bg);
    padding:6px 4px;
    border-radius:16px;
    font-weight:bold;
    box-shadow:0 4px 10px var(--shadow);
    font-size:0.68rem;
    white-space:nowrap;
    flex:1;
    text-align:center;
}
nav.menu-principal a.activo{
    background:var(--accent);
    color:white;
}

/* MAIN */
main{
    width:100%;
    max-width:600px;
    display:flex;
    flex-direction:column;
    gap:30px;
}

.card{
    background:var(--card-bg);
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 25px var(--shadow);
    width:100%;
}

.card-title{
    font-family:'Playfair Display',serif;
    margin-bottom:20px;
}

.btn-accion{padding:8px 20px;border:none;border-radius:20px;background:var(--accent);color:white;cursor:pointer;font-size:0.9rem}

/* SISMOS */
#sismos-card .card-title{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
#sismos-card .card-title img{height:1.2em;width:1.2em;border-radius:50%;vertical-align:middle}
.sismo-barra{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:bold;font-size:0.8rem;color:var(--text-main)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulsoSismo 1.6s infinite}
.live.off{opacity:.6}
.live.off i{animation:none}
@keyframes pulsoSismo{0%{box-shadow:0 0 0 0 rgba(176,158,141,.7)}100%{box-shadow:0 0 0 9px rgba(176,158,141,0)}}
.sismo-filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sismo-filtros button{padding:6px 14px;border:none;border-radius:16px;background:var(--card-bg);color:var(--text-main);font-family:inherit;font-weight:bold;font-size:0.8rem;cursor:pointer;box-shadow:0 4px 10px var(--shadow)}
.sismo-filtros button.activo{background:var(--accent);color:white}
.sismo{display:flex;gap:12px;align-items:flex-start;background:var(--card-bg);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 10px var(--shadow)}
.sismo.nuevo{box-shadow:0 0 0 2px var(--accent),0 4px 10px var(--shadow)}
.sismo-logo{width:38px;height:38px;border-radius:50%;flex-shrink:0}
.sismo-cuerpo{flex:1;min-width:0}
.sismo h3{font-family:'Playfair Display',serif;font-size:1rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sismo .etiqueta-nuevo{font-family:'Nunito',sans-serif;font-size:.65rem;background:var(--accent);color:white;border-radius:10px;padding:2px 8px}
.sismo p{font-size:.9rem;line-height:1.5;word-break:break-word}
.sismo .mag{font-weight:bold}
.sismo.m5 .mag{color:#a8641f}
.sismo.m6 .mag{color:#9c2f22}
.sismo .enlaces{margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem}
.sismo a{color:var(--text-main);font-weight:bold;text-decoration:underline}
.sismo-vacio,.sismo-error{text-align:center;opacity:.75;padding:20px 0}
.btn-telegram{display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:8px 20px;border-radius:20px;background:var(--accent);color:white;font-weight:bold;font-size:0.9rem}
</style>
</head>
<body>

<header>
<div class="logo-area">
<h1>MichiHub</h1>
<p>Sismos</p>
</div>
</header>

<nav class="menu-principal">
<a href="index.html">🏠 Inicio</a>
<a href="chat.html">💬 Chat</a>
<a href="Comunidad.html">📸 Comunidad</a>
<a href="Sismos.html" class="activo">⚠️ Sismos</a>
</nav>

<main>
<div class="card" id="sismos-card">
<h2 class="card-title"><img src="icon-192.png" alt="">Reportes de sismos en vivo</h2>
<div class="sismo-barra">
<span class="live" id="estado-live"><i></i><span id="estado-texto">Conectando…</span></span>
<a id="btn-telegram" class="btn-telegram" href="#" target="_blank" rel="noopener" style="display:none"><img src="icon-192.png" alt="" style="height:1em;width:1em;border-radius:50%;">Canal de Telegram</a>
</div>
<div class="sismo-filtros" id="filtros">
<button data-min="4.5" class="activo">M4.5+</button>
<button data-min="5">M5+</button>
<button data-min="6">M6+</button>
</div>
<div id="lista"><p class="sismo-vacio">Cargando reportes…</p></div>
<p style="font-size:.75rem;opacity:.6;text-align:center;margin-top:10px">Datos: USGS (últimas 24 h). Se actualiza cada minuto.</p>
</div>

</main>

<script>
(function(){

/* Poné acá el enlace de tu canal (ej. "https://t.me/tu_canal") y aparecerá el botón. */
const TELEGRAM_URL = "https://t.me/michihub_oficial";

const FEED = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson";
const REFRESCO_MS = 60000;
let sismos = [];
let minimo = 4.5;
let primeraCarga = true;
const vistos = new Set();

function esc(t){ return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dos(n){ return String(n).padStart(2,"0"); }
function fechaUTC(ms){
    const d = new Date(ms);
    return dos(d.getUTCDate())+"/"+dos(d.getUTCMonth()+1)+"/"+d.getUTCFullYear()+" "+dos(d.getUTCHours())+":"+dos(d.getUTCMinutes())+" UTC";
}
function hace(ms){
    const m = Math.max(0, Math.round((Date.now()-ms)/60000));
    if(m < 1) return "ahora";
    if(m < 60) return "hace "+m+" min";
    const h = Math.floor(m/60);
    return "hace "+h+" h "+dos(m%60)+" min";
}

function pintar(){
    const cont = document.getElementById("lista");
    const filtrados = sismos.filter(s => s.mag >= minimo);
    if(!filtrados.length){
        cont.innerHTML = '<p class="sismo-vacio">No hay sismos de M'+minimo+'+ en las últimas 24 horas 🐾</p>';
        return;
    }
    cont.innerHTML = filtrados.map(s => {
        const clase = s.mag >= 6 ? "m6" : s.mag >= 5 ? "m5" : "";
        const nuevo = (Date.now()-s.tiempo) < 3600000;
        const tipo = s.tipoMag ? esc(s.tipoMag) : "M";
        return '<div class="sismo '+clase+(nuevo?" nuevo":"")+'">'
            + '<img class="sismo-logo" src="icon-192.png" alt="">'
            + '<div class="sismo-cuerpo">'
            + '<h3><span>⚠️ Sismo detectado</span>'+(nuevo?'<span class="etiqueta-nuevo">NUEVO</span>':"")+'</h3>'
            + '<p>📍 '+esc(s.lugar)+'<br>'
            + '<span class="mag">'+s.mag.toFixed(1)+' '+tipo+'</span> · '+s.prof.toFixed(1)+' km<br>'
            + '🕐 '+fechaUTC(s.tiempo)+' <span style="opacity:.6">('+hace(s.tiempo)+')</span></p>'
            + '<div class="enlaces">'
            + '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">🔗 Ver detalle en USGS</a>'
            + '<a href="https://www.google.com/maps?q='+s.lat+','+s.lon+'" target="_blank" rel="noopener">🗺️ Ver en mapa</a>'
            + '</div></div></div>';
    }).join("");
}

function estado(ok, texto){
    const el = document.getElementById("estado-live");
    el.classList.toggle("off", !ok);
    document.getElementById("estado-texto").textContent = texto;
}

async function cargar(){
    try{
        const r = await fetch(FEED, {cache:"no-store"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        const datos = await r.json();
        sismos = datos.features.map(f => ({
            id: f.id,
            mag: f.properties.mag,
            tipoMag: f.properties.magType,
            lugar: f.properties.place || "Ubicación desconocida",
            tiempo: f.properties.time,
            url: f.properties.url,
            lon: f.geometry.coordinates[0],
            lat: f.geometry.coordinates[1],
            prof: f.geometry.coordinates[2]
        })).filter(s => typeof s.mag === "number")
          .sort((a,b) => b.tiempo - a.tiempo);

        // aviso del navegador para sismos nuevos (si el usuario dio permiso)
        if(!primeraCarga && "Notification" in window && Notification.permission === "granted"){
            sismos.filter(s => !vistos.has(s.id) && s.mag >= minimo).slice(0,3).forEach(s => {
                new Notification("⚠️ Sismo M"+s.mag.toFixed(1), {body: s.lugar, icon: "icon-192.png"});
            });
        }
        sismos.forEach(s => vistos.add(s.id));
        primeraCarga = false;

        const d = new Date();
        estado(true, "EN VIVO · actualizado "+dos(d.getHours())+":"+dos(d.getMinutes()));
        pintar();
    }catch(e){
        estado(false, "Sin conexión, reintentando…");
        if(!sismos.length) document.getElementById("lista").innerHTML = '<p class="sismo-error">No se pudieron cargar los reportes. Se reintentará automáticamente.</p>';
    }
}

document.getElementById("filtros").addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b) return;
    minimo = parseFloat(b.dataset.min);
    document.querySelectorAll("#filtros button").forEach(x => x.classList.toggle("activo", x === b));
    if("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    pintar();
});

if(TELEGRAM_URL){
    const a = document.getElementById("btn-telegram");
    a.href = TELEGRAM_URL;
    a.style.display = "inline-block";
}

cargar();
setInterval(cargar, REFRESCO_MS);
setInterval(pintar, 60000);

})();
</script>
</body>
</html>
